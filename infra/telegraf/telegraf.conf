[agent]
  interval = "5s"
  flush_interval = "5s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  version = "3.4.0"
  topics = ["minecraft-events"]
  consumer_group = "telegraf-events"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "mc_event"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "type"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "player"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "world"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "detail"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "x"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "y"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "z"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "uuid"
      type = "string"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "chat"
      type = "string"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "tps"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "used_ram_mb"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "max_ram_mb"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "online_players"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "dropped_events"
      type = "int"
      optional = true

[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  version = "3.4.0"
  topics = ["minecraft-metrics"]
  consumer_group = "telegraf-metrics"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "mc_metric"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "type"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "world"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "player"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "ore"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "count"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "chunk_x"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "chunk_z"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "active_players"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "flagged"
      type = "bool"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "ratio"
      type = "float"
      optional = true
