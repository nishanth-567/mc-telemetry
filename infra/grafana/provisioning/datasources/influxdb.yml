apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $__env{INFLUX_ORG}
      defaultBucket: $__env{INFLUX_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: $__env{INFLUX_TOKEN}
